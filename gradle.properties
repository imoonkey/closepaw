# Project-wide Gradle settings.
# 4g heap is the AGP-recommended floor when minifyEnabled=true — R8 shaking on
# the release variant OOMs at the 2g default once the dep graph (Compose +
# OpenAI SDK + BouncyCastle + Conscrypt + Leap) lands in memory.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=35

# Enable Gradle Build Cache (shared across worktrees)
org.gradle.caching=true

# Enable parallel builds
org.gradle.parallel=true

# Enable configuration cache (faster subsequent builds)
org.gradle.configuration-cache=true

# App version (consumed by app/build.gradle.kts)
VERSION_NAME=0.1.0
VERSION_CODE=1
