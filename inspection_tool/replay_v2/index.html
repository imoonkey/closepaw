<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Android Agent Replay v2</title>
  <link rel="stylesheet" href="./styles.css?v=8" />
  <link rel="icon" type="image/png" href="./favicon.png" />
</head>
<body>
  <header class="header">
    <div class="title">Android Agent Replay v2</div>
  </header>

  <main class="layout">
    <section class="panel">
      <div class="panel-header">Step Tree</div>
      <div id="stepPanelBody" class="panel-body">
        <div class="left-controls">
          <select id="debugRunSelect" class="select">
            <option value="" selected>Debug Run...</option>
          </select>
          <select id="evalRunSelect" class="select">
            <option value="" selected>Eval Run...</option>
          </select>
          <select id="evalTaskSelect" class="select" disabled>
            <option value="" selected>Eval Task...</option>
          </select>
          <button id="refreshBtn" class="btn">Refresh</button>
          <span id="meta" class="pill left-meta">No trace loaded</span>
        </div>
        <div id="stepSummaryPanel"></div>
        <div class="timeline-toolbar">
          <button id="prevBtn" class="btn">Prev</button>
          <button id="nextBtn" class="btn">Next</button>
          <input id="filterInput" class="input" type="text" placeholder="Filter steps..." />
          <button id="clearFilterBtn" class="btn">Clear</button>
          <span id="stepCounter" class="pill">0 / 0</span>
        </div>
        <div id="treePanel" class="tree-panel hint">Load a trace folder.</div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-header">Detail</div>
      <div id="detailPanel" class="panel-body hint">Select a step.</div>
    </section>
  </main>

  <script type="module" src="./replay.js?v=8"></script>
</body>
</html>
