<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Android Agent Replay v2</title>
  <link rel="stylesheet" href="./styles.css?v=2" />
  <link rel="icon" type="image/png" href="./favicon.png" />
</head>
<body>
  <header class="header">
    <div class="title">Android Agent Replay v2</div>
    <div class="toolbar">
      <select id="runSelect" class="select">
        <option value="" disabled selected>Select a run...</option>
      </select>
      <button id="refreshBtn" class="btn">Refresh</button>
      <span id="meta" class="pill">No trace loaded</span>
    </div>
  </header>

  <main class="layout">
    <section class="panel">
      <div class="panel-header">Step Tree</div>
      <div class="panel-body">
        <div id="stepSummaryPanel"></div>
        <div class="timeline-toolbar">
          <button id="prevBtn" class="btn">Prev</button>
          <button id="nextBtn" class="btn">Next</button>
          <input id="filterInput" class="input" type="text" placeholder="Filter steps..." />
          <button id="clearFilterBtn" class="btn">Clear</button>
          <span id="stepCounter" class="pill">0 / 0</span>
        </div>
        <div id="treePanel" class="tree-panel hint">Load a trace folder.</div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-header">Detail</div>
      <div id="detailPanel" class="panel-body hint">Select a step.</div>
    </section>
  </main>

  <script type="module" src="./replay.js?v=2"></script>
</body>
</html>
