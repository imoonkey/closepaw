<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Android Agent Trace Viewer</title>
  <link rel="stylesheet" href="./trace_viewer.css" />
</head>
<body>
  <div class="header">
    <div class="title">Android Agent Trace Viewer</div>
    <div class="controls">
      <span class="pill mono" id="metaPill">No trace loaded</span>
      <input id="folderInput" type="file" webkitdirectory directory multiple />
      <button class="btn" id="loadBtn">Load Trace Folder</button>
    </div>
  </div>

  <div class="layout">
    <div class="panel">
      <div class="panel-header">Events</div>
      <div class="panel-body">
        <input class="search" id="filterInput" placeholder="Filter by type / turn / text..." />
        <div class="spacer"></div>
        <ul class="events" id="eventsList"></ul>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">Event Details</div>
      <div class="panel-body">
        <div id="eventDetails" class="hint">Pick a trace folder, then select an event.</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">Artifact Viewer</div>
      <div class="panel-body">
        <div id="artifactViewer" class="hint">Select an artifact chip to preview.</div>
      </div>
    </div>
  </div>

  <script src="./trace_viewer.js"></script>
</body>
</html>
